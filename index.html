<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7928CA">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>txt to js</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --glass-color: rgba(255, 255, 255, 0.2);
        }
        .glass {
            background: var(--glass-color);
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <header class="text-white p-4 glass fixed top-0 left-0 w-full">
        <nav class="container mx-auto flex justify-between">
            <h1 class="text-2xl font-bold">txt to js</h1>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" id="save-btn">Save as JS</button>
        </nav>
    </header>
    <main class="container mx-auto p-4 mt-12 glass">
        <h2 class="text-2xl font-bold mb-4">Enter your text:</h2>
        <textarea class="w-full h-64 p-4 border border-gray-400 rounded" id="text-input"></textarea>
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4" id="convert-btn">Convert to JS</button>
        <pre class="w-full p-4 border border-gray-400 rounded mt-4" id="js-output"></pre>
    </main>
    <script>
        const textInput = document.getElementById('text-input');
        const convertBtn = document.getElementById('convert-btn');
        const jsOutput = document.getElementById('js-output');
        const saveBtn = document.getElementById('save-btn');

        convertBtn.addEventListener('click', () => {
            const text = textInput.value;
            const jsCode = `console.log(\`${text}\`);`;
            jsOutput.innerText = jsCode;
        });

        saveBtn.addEventListener('click', () => {
            const text = textInput.value;
            const jsCode = `console.log(\`${text}\`);`;
            const blob = new Blob([jsCode], {type: 'application/javascript'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'output.js';
            a.click();
        });
    </script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>
